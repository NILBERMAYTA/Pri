    <style>
      * {
        box-sizing: border-box;
      }
      .floating-controls {
        position: fixed;
        top: 1.2rem;
        left: 0;
        right: 0;
        width: 100%;
        display: flex;
        justify-content: space-between;
        padding: 0 1.2rem;
        z-index: 9999;
        pointer-events: none;
      }
      .ctrl-btn {
        pointer-events: auto;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        background: rgba(20, 20, 28, 0.6);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 215, 0, 0.3);
        color: #ffea00;
        font-size: 1.2rem;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        text-decoration: none;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        transition: all 0.3s ease;
      }
      .ctrl-btn:hover {
        transform: scale(1.1);
        background: rgba(255, 183, 3, 0.25);
        border-color: #ffea00;
      }
      .music-btn.playing {
        animation: rotateMusic 4s linear infinite;
      }
      @keyframes rotateMusic {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      /* Apple Music Lyrics Flow */
      .apple-lyrics-wrapper {
        position: fixed;
        top: 2rem;
        left: 50%;
        transform: translateX(-50%);
        width: 90%;
        max-width: 520px;
        height: 50vh;
        z-index: 9999;
        pointer-events: auto;
        overflow-y: scroll;
        overflow-x: hidden;
        scroll-behavior: smooth;
        padding: 0 1rem;
        -webkit-mask-image: linear-gradient(to bottom, transparent 0%, rgba(0,0,0,1) 15%, rgba(0,0,0,1) 80%, transparent 100%);
        mask-image: linear-gradient(to bottom, transparent 0%, rgba(0,0,0,1) 15%, rgba(0,0,0,1) 80%, transparent 100%);
        scrollbar-width: none;
      }
      .apple-lyrics-wrapper::-webkit-scrollbar {
        display: none;
      }

      .apple-lyric-line {
        font-family: 'Outfit', sans-serif;
        font-size: 1.55rem;
        font-weight: 700;
        line-height: 1.4;
        color: rgba(255, 255, 255, 0.42);
        margin-bottom: 1.6rem;
        text-align: center;
        cursor: pointer;
        transition: color 0.4s cubic-bezier(0.2, 0, 0, 1),
                    transform 0.4s cubic-bezier(0.2, 0, 0, 1),
                    opacity 0.4s cubic-bezier(0.2, 0, 0, 1),
                    text-shadow 0.4s cubic-bezier(0.2, 0, 0, 1);
        user-select: none;
        letter-spacing: -0.3px;
      }

      .apple-lyric-line.active {
        color: #ffffff;
        font-size: 1.95rem;
        font-weight: 800;
        opacity: 1;
        transform: scale(1.05);
        text-shadow: 0 0 20px rgba(255, 255, 255, 0.7), 0 0 40px rgba(255, 230, 80, 0.5);
        margin-top: 0.6rem;
        margin-bottom: 1.8rem;
      }

      .apple-lyric-line.past {
        color: rgba(255, 255, 255, 0.25);
      }

      .apple-lyric-line:hover:not(.active) {
        color: rgba(255, 255, 255, 0.7);
      }

      /* Subtle blinking tap hint */
      .tap-hint {
        position: fixed;
        top: 52%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 10000;
        color: rgba(255, 234, 50, 0.95);
        font-family: 'Outfit', sans-serif;
        font-size: 1.15rem;
        font-weight: 700;
        letter-spacing: 3px;
        text-transform: uppercase;
        pointer-events: none;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        text-shadow: 0 0 15px rgba(255, 215, 0, 0.9), 0 0 30px rgba(251, 133, 0, 0.6);
        animation: subtleGlowPulse 2s ease-in-out infinite alternate;
        transition: opacity 0.5s ease, transform 0.5s ease;
        text-align: center;
        width: 100%;
        padding: 0 1rem;
      }

      .tap-hint.hidden {
        opacity: 0 !important;
        visibility: hidden !important;
        transform: translate(-50%, -60%) scale(0.85) !important;
        pointer-events: none !important;
      }

      @keyframes subtleGlowPulse {
        0% {
          opacity: 0.4;
          transform: translate(-50%, -50%) scale(0.95);
          letter-spacing: 2px;
        }
        100% {
          opacity: 1;
          transform: translate(-50%, -50%) scale(1.06);
          letter-spacing: 4px;
          text-shadow: 0 0 25px rgba(255, 234, 0, 1), 0 0 45px rgba(251, 133, 0, 0.9);
        }
      }

      /* Dynamic bloom scale when playing */
      .flowers {
        transition: transform 1.2s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .flowers.active-bloom {
        transform: scale(0.98);
      }

      /* Song Info Banner with Auto-Fade */
      .song-info-banner {
        position: fixed;
        top: 5rem;
        left: 50%;
        transform: translateX(-50%);
        z-index: 9998;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        pointer-events: none;
        transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1),
                    transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        opacity: 1;
        width: 90%;
        max-width: 440px;
      }

      .song-info-banner.hidden {
        opacity: 0 !important;
        transform: translate(-50%, -20px) scale(0.95) !important;
        pointer-events: none !important;
      }

      .song-title {
        font-family: 'Outfit', sans-serif;
        font-size: 1.65rem;
        font-weight: 800;
        line-height: 1.25;
        color: #ffffff;
        margin: 0;
        letter-spacing: -0.4px;
        text-shadow: 0 0 20px rgba(255, 255, 255, 0.7), 0 0 40px rgba(255, 230, 80, 0.5);
      }

      .song-artist {
        font-family: 'Outfit', sans-serif;
        font-size: 1.05rem;
        font-weight: 500;
        color: rgba(255, 255, 255, 0.75);
        margin-top: 0.25rem;
        letter-spacing: 0.2px;
        text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
      }

      @media (max-width: 480px) {
        .song-info-banner {
          top: 4.5rem;
        }
        .song-title {
          font-size: 1.35rem;
        }
        .song-artist {
          font-size: 0.95rem;
        }
        .apple-lyrics-wrapper {
          top: 3rem;
          height: 46vh;
          width: 92%;
        }
        .apple-lyric-line {

          margin-bottom: 1.3rem;
        }

          font-size: 1.65rem;
          margin-top: 0.4rem;

        }
        .tap-hint {
          font-size: 1.05rem;
          top: 50%;
        }
